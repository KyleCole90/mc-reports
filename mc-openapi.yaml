servers:
- url: https://{host}
  variables:
    host:
      default: api.masteryconnect.com
components:
  securitySchemes:
    oauth2_client_credentials:
      type: oauth2
      description: OAuth 2.0 Client Credentials. Exchange your client_id/client_secret
        at the token URL for a short-lived Bearer token, then call the API with it.
      flows:
        clientCredentials:
          tokenUrl: "/api/v2/token"
          scopes:
            districts:read: Read the district
            sections:read: Read sections
            schools:read: Read schools
            materials:read: Read materials
            assessments:read: Read assessments
            objectives:read: Read objectives (standards)
            items:read: Read assessment items
            banks:read: Read banks
            questions:read: Read questions
            passages:read: Read passages
            curriculum_maps:read: Read curriculum maps
            class_objectives:read: Read class objectives
            classrooms:read: Read classrooms
            teachers:read: Read teachers
            pathways:read: Read pathways
            reports:read: Read reports
  schemas:
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string
security:
- oauth2_client_credentials: []
