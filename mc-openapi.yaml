---
openapi: 3.0.1
info:
  title: MasteryConnect REST API
  version: v2
  description: 'Read-only, district-scoped data API secured with OAuth 2.0 Client
    Credentials: exchange your client_id/client_secret for a short-lived Bearer token,
    then call the API with it.'
paths:
  "/api/v2/banks/{bank_id}/passages":
    parameters:
    - name: bank_id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: List the passages of a bank
      tags:
      - Passages
      security:
      - oauth2_client_credentials:
        - passages:read
      parameters:
      - name: sort
        in: query
        schema:
          type: string
        required: false
        description: 'Comma-separated; prefix with - for descending. Allowed: created_at.'
      - name: page[number]
        in: query
        schema:
          type: integer
        required: false
      - name: page[size]
        in: query
        schema:
          type: integer
          maximum: 100
        required: false
      responses:
        '200':
          description: passages listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                        relationships:
                          type: object
                  meta:
                    type: object
                  links:
                    type: object
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '403':
          description: token valid but lacks the passages:read scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '404':
          description: bank not shared with the caller district
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '422':
          description: invalid pagination parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
  "/api/v2/banks/{bank_id}/passages/{id}":
    parameters:
    - name: bank_id
      in: path
      schema:
        type: integer
      required: true
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: Fetch a passage in a bank
      tags:
      - Passages
      security:
      - oauth2_client_credentials:
        - passages:read
      responses:
        '200':
          description: passage found
          content:
            application/json:
